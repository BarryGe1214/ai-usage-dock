<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#172744"/>
    </linearGradient>
    <linearGradient id="arc" x1="160" y1="220" x2="860" y2="800">
      <stop offset="0" stop-color="#66a6ff"/>
      <stop offset="0.55" stop-color="#4f7dff"/>
      <stop offset="1" stop-color="#34e2b0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="1" stop-color="#3ce0b4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="322" fill="none" stroke="#263a5c" stroke-width="46" stroke-linecap="round" stroke-dasharray="1410 610" transform="rotate(135 512 512)"/>
  <circle cx="512" cy="512" r="322" fill="none" stroke="url(#arc)" stroke-width="46" stroke-linecap="round" stroke-dasharray="980 1040" transform="rotate(135 512 512)" filter="url(#glow)"/>
  <g>
    <rect x="342" y="560" width="74" height="126" rx="37" fill="url(#bar)" opacity="0.75"/>
    <rect x="475" y="480" width="74" height="206" rx="37" fill="url(#bar)"/>
    <rect x="608" y="396" width="74" height="290" rx="37" fill="url(#bar)" opacity="0.9"/>
  </g>
  <circle cx="512" cy="512" r="34" fill="#eaf2ff"/>
  <circle cx="512" cy="512" r="15" fill="#3ce0b4"/>
</svg>
