name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft:
        description: Publish the release as a draft
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version and create tag
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping the automatic release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG."
          fi

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured. Add the signing private key in Settings > Secrets and variables > Actions, otherwise the published release would break in-app updates."
            exit 1
          fi
          echo '{"bundle":{"createUpdaterArtifacts":true}}' > updater.config.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test frontend and native backend
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test widget behavior and installation policy
        shell: pwsh
        run: |
          dotnet run --project tests/WidgetProviderLogic/WidgetProviderLogic.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/Test-WidgetInstaller.ps1
      - name: Build Windows 11 widget package
        shell: pwsh
        env:
          WIDGET_SIGNING_PFX_BASE64: ${{ secrets.WIDGET_SIGNING_PFX_BASE64 }}
          WIDGET_SIGNING_PFX_PASSWORD: ${{ secrets.WIDGET_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:WIDGET_SIGNING_PFX_BASE64) {
            throw "WIDGET_SIGNING_PFX_BASE64 is not configured. The app installs the widget automatically and pins the signing certificate, so a temporary certificate would break widget updates."
          }
          $pfx = Join-Path $env:RUNNER_TEMP "widget-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIDGET_SIGNING_PFX_BASE64))
          ./widget-provider/build-widget.ps1 -OutputDir ./artifacts/widget -PfxPath $pfx -PfxPassword $env:WIDGET_SIGNING_PFX_PASSWORD

          $certificate = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2((Resolve-Path ./artifacts/widget/AIUsageDock.Widget.cer).Path)
          $expected = "C2A01C2B80A834302C5982151E0AA28F93A68911"
          if ($certificate.Thumbprint -ne $expected) {
            throw "Widget certificate thumbprint $($certificate.Thumbprint) does not match the pinned $expected. Update WIDGET_SIGNING_PFX_BASE64 or the pin in src-tauri/src/widget_install.rs."
          }
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "AI Usage Dock __VERSION__"
          releaseBody: |
            AI Usage Dock __VERSION__

            - Fix widget addition failing with WidgetManager 0x80040154 (class not registered): clean builds now include the native Windows App SDK runtime and activation manifest.
            - Verify the published native DLL, embedded activation registration, and actual WinRT factory activation before signing the widget package.
            - Use the MTA COM server entrypoint for widget provider callbacks.
            - Update from Settings → Software update, then retry adding AI Usage Dock in Win+W. Keep Windows Developer Mode enabled for this sideloaded provider.
            - Includes signed Windows installers, widget MSIX, certificate, and manual installer.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis,msi --config updater.config.json
      - name: Upload Windows 11 widget package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" `
            ./artifacts/widget/AIUsageDock.Widget.msix `
            ./artifacts/widget/AIUsageDock.Widget.cer `
            ./artifacts/widget/install-widget.ps1 `
            --clobber

      - name: Publish complete release
        if: github.event_name != 'workflow_dispatch' || inputs.draft == false
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Linux and macOS builds are intentionally left commented until the
  # platform-specific tray/window behavior has been verified.
  #
  # build-linux:
  #   runs-on: ubuntu-24.04
  #   ...
  #
  # build-macos:
  #   runs-on: macos-latest
  #   ...
